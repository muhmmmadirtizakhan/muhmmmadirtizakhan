name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: muhmmmadirtizakhan
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23a855f7&color_dots=%2321262d,%2300b4d8,%23f97316,%23ec4899,%2339ff14&color_dot_border=%23444c56&dot_size=13
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23a855f7&color_dots=%2321262d,%2300b4d8,%23f97316,%23ec4899,%2339ff14&color_dot_border=%23444c56&dot_size=13

      - name: Fix permissions
        run: sudo chown -R $(whoami):$(whoami) dist

      - name: Inject solid black background into SVGs
        run: |
          for f in dist/*.svg; do
            sed -i 's|<svg |<svg style="background:#000000;border-radius:8px;" |' "$f"
            sed -i '0,/<svg[^>]*>/s|<svg[^>]*>|&<rect width="100%" height="100%" fill="#000000"/>|' "$f"
          done

      - name: Push snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
